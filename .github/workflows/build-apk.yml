name: Build travel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jimo-travel-0.3.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jimo-travel-0.3.0-debug
          path: jimo-travel-0.3.0-debug.apk
          if-no-files-found: error
