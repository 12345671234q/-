name: Build CS Workout APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cs-workout-standalone

concurrency:
  group: cs-workout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CS Workout debug APK
        run: |
          chmod +x gradlew
          ./gradlew :csworkout:assembleDebug --stacktrace

      - name: Name APK
        run: cp csworkout/build/outputs/apk/debug/csworkout-debug.apk cs-workout-0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cs-workout-0.2.0-debug
          path: cs-workout-0.2.0-debug.apk
          if-no-files-found: error
