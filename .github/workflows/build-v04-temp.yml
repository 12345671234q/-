name: Build CS Workout V0.4.1 APK

on:
  push:
    branches:
      - agent/cs-workout-confirm-bill
  workflow_dispatch:

concurrency:
  group: cs-workout-v041-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild V0.4 source archive
        run: |
          cat v04bundle/part* > v04.b64
          base64 -d v04.b64 > v04.zip
          mkdir v04src
          unzip -q v04.zip -d v04src
          test -f v04src/gradlew
          test -f v04src/csworkout/build.gradle.kts

      - name: Apply V0.4.1 roster patch
        run: python v04bundle/apply_v041.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd v04src
          chmod +x gradlew
          ./gradlew :csworkout:assembleDebug --stacktrace

      - name: Name APK
        run: cp v04src/csworkout/build/outputs/apk/debug/csworkout-debug.apk cs-workout-0.4.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cs-workout-0.4.1-debug
          path: cs-workout-0.4.1-debug.apk
          if-no-files-found: error
